source [find interface/stlink.cfg]

adapter speed 4000

set CPUTAPID 0x0bc11477

# Use stm32f0x config but override flash to avoid stm32-specific driver
source [find target/stm32f0x.cfg]

# The imported target declares an STM32 flash bank and STM32-specific reset
# callbacks.  It is useful only for the Cortex-M0+ DAP setup.  Never probe or
# program that bank, and never write the STM32 clock/debug registers.
gdb memory_map disable
gdb flash_program disable
gdb breakpoint_override hard

$_TARGETNAME configure -event examine-end {}
$_TARGETNAME configure -event reset-init {}

proc cms32_reset_start {} {
    adapter speed 100
}

proc cms32_reset_end {} {
    adapter speed 4000
}

$_TARGETNAME configure -event reset-start { cms32_reset_start }
$_TARGETNAME configure -event reset-end { cms32_reset_end }

# Use the Cortex-M SYSRESETREQ mechanism.  This keeps debugger reset independent
# from an NRST signal passing through the external level converter.
reset_config none
cortex_m reset_config sysresetreq
